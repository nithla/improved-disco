<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="logo-comet-tail" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0%" stop-color="#e8bd52" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#e8bd52" stop-opacity="0" />
        </linearGradient>
        <filter id="logo-comet-glow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="2.2" />
        </filter>
    </defs>

    <path d="M 55.752 21.425 A 26 11 -24 1 1 8.248 42.575 A 26 11 -24 1 1 55.752 21.425"
        fill="none" stroke="#e8bd52" stroke-width="1.5" opacity="0.4" />

    <path class="sparkle sparkle--a" fill="#e8bd52"
        d="M14,9 C14.6,11.4 14.6,11.4 17,12 C14.6,12.6 14.6,12.6 14,15 C13.4,12.6 13.4,12.6 11,12 C13.4,11.4 13.4,11.4 14,9 Z" />
    <path class="sparkle sparkle--b" fill="#e8bd52"
        d="M47,47 C47.6,49.4 47.6,49.4 50,50 C47.6,50.6 47.6,50.6 47,53 C46.4,50.6 46.4,50.6 44,50 C46.4,49.4 46.4,49.4 47,47 Z" />

    <g class="comet">
        <circle r="7" fill="#e8bd52" opacity="0.4" filter="url(#logo-comet-glow)" />
        <path d="M 2 -3 L -20 -0.8 L 2 3 Z" fill="url(#logo-comet-tail)" />
        <circle r="4" fill="#e8bd52" />
        <circle cx="1" cy="-1.2" r="1.3" fill="#fff" opacity="0.85" />
    </g>

    <style>
        .comet {
            offset-path: path("M 55.752 21.425 A 26 11 -24 1 1 8.248 42.575 A 26 11 -24 1 1 55.752 21.425");
            offset-rotate: auto;
            animation: logo-orbit 6s linear infinite;
        }

        @keyframes logo-orbit {
            to {
                offset-distance: 100%;
            }
        }

        .sparkle {
            transform-box: fill-box;
            transform-origin: center;
            animation: logo-twinkle 2.4s ease-in-out infinite;
        }

        .sparkle--a {
            animation-delay: 0s;
        }

        .sparkle--b {
            animation-delay: 1.1s;
        }

        @keyframes logo-twinkle {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .comet {
                animation: none;
                offset-distance: 0%;
            }

            .sparkle {
                animation: none;
                opacity: 0.6;
            }
        }
    </style>
</svg>
